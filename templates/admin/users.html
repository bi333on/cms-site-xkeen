<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Управление пользователями — Админ-панель CMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .user-search-container { margin-bottom: 1rem; }
        .user-search { width: 100%; max-width: 400px; padding: 0.6rem 1rem; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 0.9rem; outline: none; }
        .user-search:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,107,0,0.1); }
    </style>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo"><a href="/">⚡ VLESS-Keenetic</a></div>
            <nav class="admin-nav">
                <a href="/admin/dashboard/" class="admin-nav-item"><span class="nav-icon">📊</span> Дашборд</a>
                <a href="/admin/stats/" class="admin-nav-item"><span class="nav-icon">📈</span> Статистика</a>
                <a href="/admin/messages/" class="admin-nav-item"><span class="nav-icon">💬</span> Сообщения</a>
                <a href="/admin/users/" class="admin-nav-item active"><span class="nav-icon">👥</span> Пользователи</a>
                <a href="/admin/pages/" class="admin-nav-item"><span class="nav-icon">📄</span> Страницы</a>
                <a href="/admin/blocks/" class="admin-nav-item"><span class="nav-icon">🧱</span> Блоки</a>
                <a href="/admin/modules/" class="admin-nav-item"><span class="nav-icon">📦</span> Модули</a>
                <a href="/admin/generator/" class="admin-nav-item"><span class="nav-icon">⚙️</span> Генератор</a>
                <a href="/admin/logout/" class="admin-nav-item admin-nav-logout"><span class="nav-icon">🚪</span> Выйти</a>
            </nav>
        </aside>
        <main class="admin-main">
            <header class="admin-topbar">
                <h1>👥 Управление пользователями</h1>
            </header>
            <div class="admin-content">
                <div class="admin-card">
                    <div class="user-search-container">
                        <input type="text" class="user-search" id="userSearch" placeholder="🔍 Поиск по имени, username или Telegram ID...">
                    </div>
                    <div class="table-wrapper">
                        <table class="admin-table" id="usersTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Аватар</th>
                                    <th>Имя</th>
                                    <th>Username</th>
                                    <th>Telegram ID</th>
                                    <th>Статус</th>
                                    <th>Роль</th>
                                    <th>Регистрация</th>
                                    <th>Вход</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="usersBody">
                                <tr><td colspan="10" class="loading-cell">⏳ Загрузка...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="table-info" id="usersCount"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        var allUsers = [];

        function loadUsers() {
            fetch('/admin/api/users/')
                .then(function(r) { return r.json(); })
                .then(function(users) {
                    allUsers = users;
                    renderUsers(users);
                });
        }

        function renderUsers(users) {
            var tbody = document.getElementById('usersBody');
            var count = document.getElementById('usersCount');
            count.textContent = 'Всего: ' + users.length;

            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="loading-cell">Нет пользователей</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(function(u) {
                var avatar = u.photo_url
                    ? '<img src="' + u.photo_url + '" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">'
                    : '<div style="width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:bold;">' + (u.first_name ? u.first_name[0].toUpperCase() : '?') + '</div>';

                return '<tr>' +
                    '<td>' + u.id + '</td>' +
                    '<td>' + avatar + '</td>' +
                    '<td><strong>' + (u.first_name || '—') + ' ' + (u.last_name || '') + '</strong></td>' +
                    '<td>' + (u.username ? '@' + u.username : '—') + '</td>' +
                    '<td><code>' + u.telegram_id + '</code></td>' +
                    '<td><span class="status-badge ' + (u.is_active ? 'status-active' : 'status-inactive') + '">' + (u.is_active ? 'Активен' : 'Заблокирован') + '</span></td>' +
                    '<td><span class="status-badge ' + (u.is_admin ? 'status-active' : 'status-warning') + '">' + (u.is_admin ? 'Админ' : 'Пользователь') + '</span></td>' +
                    '<td>' + (u.registered_at || '—') + '</td>' +
                    '<td>' + (u.last_login || '—') + '</td>' +
                    '<td>' +
                        '<button class="btn-table btn-table-toggle" onclick="toggleActive(' + u.id + ')">' + (u.is_active ? '🔒 Блок.' : '✅ Акт.') + '</button>' +
                        '<button class="btn-table btn-table-success" onclick="toggleAdmin(' + u.id + ')">👑</button>' +
                        '<button class="btn-table btn-table-delete" onclick="deleteUser(' + u.id + ', \'' + (u.first_name || u.telegram_id) + '\')">🗑</button>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        document.getElementById('userSearch').addEventListener('input', function() {
            var q = this.value.toLowerCase();
            var filtered = allUsers.filter(function(u) {
                return (u.first_name || '').toLowerCase().includes(q) ||
                       (u.last_name || '').toLowerCase().includes(q) ||
                       (u.username || '').toLowerCase().includes(q) ||
                       String(u.telegram_id).includes(q);
            });
            renderUsers(filtered);
        });

        function toggleActive(id) {
            fetch('/admin/api/users/' + id + '/toggle-active/', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) { if (d.ok) loadUsers(); });
        }

        function toggleAdmin(id) {
            fetch('/admin/api/users/' + id + '/toggle-admin/', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) { if (d.ok) loadUsers(); });
        }

        function deleteUser(id, name) {
            if (!confirm('Удалить пользователя «' + name + '»? Это действие необратимо.')) return;
            fetch('/admin/api/users/' + id + '/delete/', { method: 'DELETE' })
                .then(function(r) { return r.json(); })
                .then(function(d) { if (d.ok) loadUsers(); });
        }

        loadUsers();
    </script>
</body>
</html>
